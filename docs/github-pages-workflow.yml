name: نشر معاينة الواجهة على GitHub Pages

on:
  push:
    branches:
      - arena/019fa154-bravo-new-sestym
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الحزم
        run: npm ci || npm install

      - name: إعداد GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: استبعاد واجهات API (لا تعمل في التصدير الثابت)
        run: rm -rf src/app/api

      - name: بناء نسخة ثابتة للمعاينة
        env:
          STATIC_EXPORT: 'true'
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx next build

      - name: منع Jekyll من تجاهل ملفات _next
        run: touch out/.nojekyll

      - name: رفع المخرجات
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
